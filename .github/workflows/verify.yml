name: Native first-run checks

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'launchers/**'
      - 'tests/native-first-run.cjs'
      - 'tests/concurrent-checkpoints.cjs'
      - 'tests/rdr2-discovery.cjs'
      - '.github/workflows/verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: First launch and resume on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check game discovery and simultaneous checkpoint writes
        run: |
          node tests/rdr2-discovery.cjs
          node tests/concurrent-checkpoints.cjs
      - name: Run launcher in a fresh, isolated user fixture
        run: node tests/native-first-run.cjs
      - name: Verify first run without system Node and reuse the private runtime
        run: node tests/native-first-run.cjs --bootstrap
      - name: Check real file and isolated browser profiles with a blank page
        run: node tests/native-first-run.cjs --profiles
